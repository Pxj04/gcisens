[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcisens"
version = "0.1.3"
description = "Variance-based (Sobol') sensitivity analysis and Sensitivity Discrepancy Report for ESP-COMET and ESP-SPOTIS decision models"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Szymon Sniegowski", email = "szymon-sniegowski@zut.edu.pl" },
    { name = "Adrianna Świder", email = "adrianna-swider@zut.edu.pl" },
]
requires-python = ">=3.11"
keywords = [
    "mcda",
    "mcdm",
    "sensitivity-analysis",
    "sobol",
    "comet",
    "spotis",
    "explainability",
    "decision-support",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.3",
    "pandas>=2.2.2",
    "scipy>=1.15",
    "scikit-learn>=1.4.2",
    "SALib>=1.5.1,<2",
    "pymcdm>=1.4",
    "matplotlib>=3.8.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
docs = ["sphinx>=7", "furo", "numpydoc", "myst-parser"]

[project.urls]
Homepage = "https://github.com/Pxj04/gcisens"
Documentation = "https://gcisens.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["gcisens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running article reproduction tests (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# RUF022: __all__ is intentionally grouped by topic, not sorted.
ignore = ["RUF022"]
