name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build the released source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish checked distributions to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gcisens
    permissions:
      id-token: write

    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
