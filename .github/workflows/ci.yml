name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check gcisens tests examples
          ruff format --check gcisens tests examples
      - name: Fast tests
        run: pytest -m "not slow" -q
      - name: Article reproduction (regression tests)
        run: pytest -m slow -q
      - name: Coverage
        if: matrix.python-version == '3.11'
        run: pytest --cov=gcisens --cov-report=term-missing

  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimum versions
        run: |
          pip install pytest \
            "numpy==2.3.*" \
            "pandas==2.2.2" \
            "scipy==1.15.0" \
            "scikit-learn==1.4.2" \
            "SALib==1.5.1" \
            "pymcdm==1.4.0" \
            "matplotlib==3.8.4"
          pip install --no-deps -e .
      - name: Test
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build documentation
        run: sphinx -b html -W docs _build/html
